<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Open Soumojit Dalui's interactive portfolio fridge." />
    <title>Soumojit Dalui | Portfolio Fridge</title>
    <link rel="preconnect" href="https://unpkg.com" />
    <link rel="stylesheet" href="assets/css/fridge.css?v=fridge-1" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.167.1/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.167.1/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="fridge-scene" aria-label="Interactive 3D portfolio refrigerator"></canvas>

    <div id="scene-hint" role="status" aria-live="polite">Open the fridge</div>

    <section id="info-panel" class="overlay-panel" aria-hidden="true">
      <button class="icon-button close-button" type="button" aria-label="Close" title="Close">×</button>
      <p id="panel-kicker" class="panel-kicker"></p>
      <h1 id="panel-title"></h1>
      <div id="panel-content" class="panel-content"></div>
      <div id="panel-actions" class="panel-actions"></div>
    </section>

    <section id="game-panel" class="game-panel" aria-hidden="true">
      <div class="game-bar">
        <div>
          <p id="game-kicker" class="panel-kicker">Mini game</p>
          <h2 id="game-title"></h2>
        </div>
        <div class="game-score"><span id="game-score">0</span> pts</div>
        <button class="icon-button" id="close-game" type="button" aria-label="Close game" title="Close game">×</button>
      </div>
      <canvas id="game-canvas" aria-label="Portfolio mini game"></canvas>
      <p id="game-instruction" class="game-instruction"></p>
    </section>

    <script type="module" src="assets/js/fridge.js?v=fridge-2"></script>
  </body>
</html>
